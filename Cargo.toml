[workspace]
resolver = "2"
members = [
    "crates/silentwire",
    "crates/bdk-silentwire",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = true
authors = ["Yudistira Putra <Yudis-bit@proton.me>"]
repository = "https://github.com/Yudis-bit/silentwire"
homepage = "https://github.com/Yudis-bit/silentwire"
readme = "README.md"
keywords = ["bitcoin", "silent-payments", "bip352", "cryptography", "privacy"]
categories = ["cryptography::cryptocurrencies", "no-std"]

[workspace.dependencies]
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "alloc", "expose-field"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["compress"] }
bitcoin_hashes = { version = "=0.14.101", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }
silentwire = { path = "crates/silentwire", version = "=0.1.0", default-features = false }
bdk-silentwire = { path = "crates/bdk-silentwire", version = "=0.1.0" }

[workspace.lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
